<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:#0d0d0b;color:#f2f0e9;border-radius:16px;padding:20px;display:flex;flex-wrap:wrap;align-items:center;gap:14px;font-family:Archivo,sans-serif;box-sizing:border-box;width:100%">
<div style="flex:1 1 190px;display:flex;flex-direction:column;gap:8px">
<span style="font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:rgba(242,240,233,.5)">{{ t.from }}</span>
<div style="align-self:flex-start;background:#c8f000;color:#0d0d0b;border-radius:16px 16px 16px 4px;padding:12px 14px 8px;font:600 16px/1.3 Archivo,sans-serif;max-width:260px">{{ t.msg }}<span style="display:block;text-align:right;font:500 10px/1 'IBM Plex Mono',monospace;color:rgba(13,13,11,.55);margin-top:6px">10:42 ✓✓</span></div>
</div>
<div style="flex:0 0 auto;font:500 11px/1 'IBM Plex Mono',monospace;color:#c8f000;white-space:nowrap">→ {{ t.after }}</div>
<div style="flex:1 1 210px;background:#f2f0e9;color:#0d0d0b;border-radius:10px;overflow:hidden">
<div style="display:flex;gap:5px;align-items:center;padding:8px 10px;border-bottom:1px solid rgba(13,13,11,.1)"><span style="width:7px;height:7px;border-radius:50%;background:rgba(13,13,11,.2)"></span><span style="width:7px;height:7px;border-radius:50%;background:rgba(13,13,11,.2)"></span><span style="width:7px;height:7px;border-radius:50%;background:rgba(13,13,11,.2)"></span><span style="margin-left:6px;font:500 10px/1 'IBM Plex Mono',monospace;color:rgba(13,13,11,.5)">oteunegocio.pt</span></div>
<div style="padding:12px 14px 14px;display:grid;gap:6px;font:400 13px/1.2 Archivo,sans-serif">
<div style="font:800 12px/1 Archivo,sans-serif;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px">{{ t.hours }}</div>
<div style="display:flex;justify-content:space-between;padding:4px 6px"><span>{{ t.wk }}</span><span>{{ t.wkH }}</span></div>
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 6px;background:#c8f000;border-radius:4px;font-weight:700"><span>{{ t.sat }}</span><span style="display:flex;align-items:center;gap:6px"><span style="font:600 9px/1 'IBM Plex Mono',monospace;text-transform:uppercase;background:#0d0d0b;color:#c8f000;padding:3px 4px;border-radius:3px">{{ t.isNew }}</span>{{ t.satH }}</span></div>
<div style="display:flex;justify-content:space-between;padding:4px 6px;color:rgba(13,13,11,.5)"><span>{{ t.sun }}</span><span>{{ t.closed }}</span></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:220},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pt&quot;,&quot;en&quot;],&quot;default&quot;:&quot;pt&quot;,&quot;tsType&quot;:&quot;'pt'|'en'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const en = this.props.lang === 'en';
    return { t: en ? {
      from: 'You → MAU agent', msg: "we're open saturday 9am to 1pm", after: '40 s later', hours: 'Opening hours',
      wk: 'Mon–Fri', wkH: '9am–7pm', sat: 'Saturday', satH: '9am–1pm', sun: 'Sunday', closed: 'Closed', isNew: 'new'
    } : {
      from: 'Tu → agente MAU', msg: 'sábado abrimos das 9h às 13h', after: '40 s depois', hours: 'Horário',
      wk: 'Seg–Sex', wkH: '9h–19h', sat: 'Sábado', satH: '9h–13h', sun: 'Domingo', closed: 'Fechado', isNew: 'novo'
    } };
  }
}
</script>
</body>
</html>
